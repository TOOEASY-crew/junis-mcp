name: Publish to npm

# Runs on version tags (v0.5.0, …). Publishing needs ONE of:
#   - npm trusted publishing configured for this repository/workflow on npmjs.com (then NPM_TOKEN is not needed), or
#   - an npm automation token stored as the repository secret NPM_TOKEN.
# `--provenance` requires `id-token: write` (below) and a public GitHub repository.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run type-check
      - run: npm test
      - run: npm run build
      - name: Check that the tag matches package.json
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}" >&2
            exit 1
          fi
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
